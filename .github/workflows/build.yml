name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            asset: |
              dist/*.AppImage
              dist/latest*.yml
          - os: windows-latest
            target: win
            asset: |
              dist/*.exe
              dist/latest*.yml
          - os: macos-latest
            target: mac
            asset: |
              dist/*.dmg
              dist/latest*.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm install
      - run: npm test
      - run: npx electron-builder --${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.target }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
          if-no-files-found: warn
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release notes come from the annotated tag message, never from the
          # commit subject. Create the release only if it does not exist yet.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-from-tag --title "$GITHUB_REF_NAME"
          fi
          for f in dist/*; do
            case "$f" in
              *latest*.yml|*.AppImage|*.exe|*.dmg|*.blockmap) gh release upload "$GITHUB_REF_NAME" "$f" --clobber ;;
            esac
          done
